plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rokid.pocketweb'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.rokid.pocketweb'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
