name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: |
          mkdir -p build/head-test
          javac -d build/head-test app/src/main/java/dev/rokid/pocketweb/HeadGestureDetector.java tests/HeadGestureDetectorTest.java
          java -cp build/head-test dev.rokid.pocketweb.HeadGestureDetectorTest
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rokid-pocket-web-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
